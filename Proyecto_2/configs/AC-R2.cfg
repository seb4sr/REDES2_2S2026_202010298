enable
configure terminal
hostname AC-R2
no ip domain-lookup
interface GigabitEthernet0/0
description AC-R1
ip address 192.168.98.34 255.255.255.252
no shutdown
exit
interface GigabitEthernet1/0
description AC-R4
ip address 192.168.98.41 255.255.255.252
no shutdown
exit
interface GigabitEthernet2/0
description AC-R5
ip address 192.168.98.45 255.255.255.252
no shutdown
exit
interface GigabitEthernet0/0
ip ospf cost 1
exit
interface GigabitEthernet1/0
ip ospf cost 4
exit
interface GigabitEthernet2/0
ip ospf cost 8
exit
router ospf 1
router-id 22.22.22.22
passive-interface default
no passive-interface GigabitEthernet0/0
no passive-interface GigabitEthernet1/0
no passive-interface GigabitEthernet2/0
network 192.168.98.34 0.0.0.0 area 0
network 192.168.98.41 0.0.0.0 area 0
network 192.168.98.45 0.0.0.0 area 0
exit
end
write memory
