enable
configure terminal
hostname ML-R1
no ip domain-lookup
interface GigabitEthernet0/0
description FG-R1
ip address 192.168.98.6 255.255.255.252
no shutdown
exit
interface GigabitEthernet1/0
description AC-R1
ip address 192.168.98.10 255.255.255.252
no shutdown
exit
interface GigabitEthernet2/0
description ML-R2
ip address 192.168.98.65 255.255.255.252
no shutdown
exit
interface GigabitEthernet3/0
description ML-R3
ip address 192.168.98.69 255.255.255.252
no shutdown
exit
interface GigabitEthernet4/0
description ML-R4
ip address 192.168.98.73 255.255.255.252
no shutdown
exit
interface GigabitEthernet5/0
description ML-R5
ip address 192.168.98.77 255.255.255.252
no shutdown
exit
router eigrp 100
no auto-summary
passive-interface default
no passive-interface GigabitEthernet2/0
no passive-interface GigabitEthernet3/0
no passive-interface GigabitEthernet4/0
no passive-interface GigabitEthernet5/0
network 192.168.98.65 0.0.0.0
network 192.168.98.69 0.0.0.0
network 192.168.98.73 0.0.0.0
network 192.168.98.77 0.0.0.0
redistribute bgp 65003 metric 100000 10 255 1 1500
exit
ip route 172.16.32.0 255.255.255.0 Null0
router bgp 65003
bgp log-neighbor-changes
network 172.16.32.0 mask 255.255.255.0
neighbor 192.168.98.5 remote-as 65001
neighbor 192.168.98.9 remote-as 65002
exit
end
write memory
