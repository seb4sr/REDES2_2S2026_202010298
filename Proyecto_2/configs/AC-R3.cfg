enable
configure terminal
hostname AC-R3
no ip domain-lookup
interface GigabitEthernet0/0
description AC-R1
ip address 192.168.98.38 255.255.255.252
no shutdown
exit
interface GigabitEthernet1/0
description AC-R4
ip address 192.168.98.49 255.255.255.252
no shutdown
exit
interface GigabitEthernet2/0
description AC-R5
ip address 192.168.98.53 255.255.255.252
no shutdown
exit
interface GigabitEthernet0/0
ip ospf network point-to-point
exit
interface GigabitEthernet1/0
ip ospf network point-to-point
exit
interface GigabitEthernet2/0
ip ospf network point-to-point
exit
interface GigabitEthernet0/0
ip ospf cost 2
exit
interface GigabitEthernet1/0
ip ospf cost 16
exit
interface GigabitEthernet2/0
ip ospf cost 32
exit
router ospf 1
router-id 23.23.23.23
passive-interface default
no passive-interface GigabitEthernet0/0
no passive-interface GigabitEthernet1/0
no passive-interface GigabitEthernet2/0
network 192.168.98.38 0.0.0.0 area 0
network 192.168.98.49 0.0.0.0 area 0
network 192.168.98.53 0.0.0.0 area 0
exit
end
write memory
