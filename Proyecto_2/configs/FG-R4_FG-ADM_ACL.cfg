permit tcp 172.16.18.0 0.0.0.127 host 192.168.98.242 eq 80
permit tcp 172.16.18.0 0.0.0.127 host 192.168.98.242 eq 443
permit icmp 172.16.18.0 0.0.0.127 172.16.18.128 0.0.0.127
permit tcp 172.16.18.0 0.0.0.127 172.16.18.128 0.0.0.127 eq 80
permit tcp 172.16.18.0 0.0.0.127 172.16.18.128 0.0.0.127 eq 443
permit icmp 172.16.18.0 0.0.0.127 172.16.28.0 0.0.0.63
permit tcp 172.16.18.0 0.0.0.127 172.16.28.0 0.0.0.63 eq 80
permit tcp 172.16.18.0 0.0.0.127 172.16.28.0 0.0.0.63 eq 443
