enable
configure terminal
hostname ML-R2
no ip domain-lookup
interface GigabitEthernet0/0
description ML-R1
ip address 192.168.98.66 255.255.255.252
no shutdown
exit
interface GigabitEthernet6/0
description Soporte
ip address 172.16.32.1 255.255.255.192
no shutdown
ip helper-address 192.168.98.254
exit
router eigrp 100
no auto-summary
passive-interface default
no passive-interface GigabitEthernet0/0
network 192.168.98.66 0.0.0.0
network 172.16.32.1 0.0.0.0
exit
end
write memory
