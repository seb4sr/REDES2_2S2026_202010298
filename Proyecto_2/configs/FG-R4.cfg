enable
configure terminal
hostname FG-R4
no ip domain-lookup
interface GigabitEthernet0/0
description FG-R2
ip address 192.168.98.26 255.255.255.252
no shutdown
exit
interface GigabitEthernet6/0
description Administracion
ip address 172.16.18.1 255.255.255.128
no shutdown
ip helper-address 192.168.98.254
exit
router ospf 1
router-id 14.14.14.14
passive-interface default
no passive-interface GigabitEthernet0/0
network 192.168.98.26 0.0.0.0 area 0
network 172.16.18.1 0.0.0.0 area 0
exit
end
write memory
