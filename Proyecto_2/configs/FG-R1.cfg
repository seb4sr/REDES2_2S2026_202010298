enable
configure terminal
hostname FG-R1
no ip domain-lookup
interface GigabitEthernet0/0
description AC-R1
ip address 192.168.98.1 255.255.255.252
no shutdown
exit
interface GigabitEthernet1/0
description ML-R1
ip address 192.168.98.5 255.255.255.252
no shutdown
exit
interface GigabitEthernet2/0
description FG-R2
ip address 192.168.98.17 255.255.255.252
no shutdown
exit
interface GigabitEthernet3/0
description FG-R3
ip address 192.168.98.21 255.255.255.252
no shutdown
exit
router ospf 1
router-id 11.11.11.11
passive-interface default
no passive-interface GigabitEthernet2/0
no passive-interface GigabitEthernet3/0
network 192.168.98.17 0.0.0.0 area 0
network 192.168.98.21 0.0.0.0 area 0
redistribute bgp 65001 subnets
exit
ip route 172.16.18.0 255.255.255.0 Null0
router bgp 65001
bgp log-neighbor-changes
network 172.16.18.0 mask 255.255.255.0
network 192.168.98.240 mask 255.255.255.252
neighbor 192.168.98.2 remote-as 65002
neighbor 192.168.98.6 remote-as 65003
exit
end
write memory
