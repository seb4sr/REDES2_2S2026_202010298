enable
configure terminal
hostname AC-R1
no ip domain-lookup
interface GigabitEthernet0/0
description FG-R1
ip address 192.168.98.2 255.255.255.252
no shutdown
exit
interface GigabitEthernet1/0
description ML-R1
ip address 192.168.98.9 255.255.255.252
no shutdown
exit
interface GigabitEthernet2/0
description AC-R2
ip address 192.168.98.33 255.255.255.252
no shutdown
exit
interface GigabitEthernet3/0
description AC-R3
ip address 192.168.98.37 255.255.255.252
no shutdown
exit
interface GigabitEthernet2/0
ip ospf cost 1
exit
interface GigabitEthernet3/0
ip ospf cost 2
exit
router ospf 1
router-id 21.21.21.21
passive-interface default
no passive-interface GigabitEthernet2/0
no passive-interface GigabitEthernet3/0
network 192.168.98.33 0.0.0.0 area 0
network 192.168.98.37 0.0.0.0 area 0
redistribute bgp 65002 subnets
exit
ip route 172.16.28.0 255.255.255.0 Null0
router bgp 65002
bgp log-neighbor-changes
network 172.16.28.0 mask 255.255.255.0
network 192.168.98.254 mask 255.255.255.255
neighbor 192.168.98.1 remote-as 65001
neighbor 192.168.98.10 remote-as 65003
exit
end
write memory
